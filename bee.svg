<svg xmlns="http://www.w3.org/2000/svg" width="80" height="55" viewBox="0 0 80 55">
  <!-- GT text sitting at the bottom -->
  <text x="4" y="52" font-size="22" font-weight="600" fill="white"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">GT</text>
  <!-- bee flies above GT -->
  <text x="0" y="28" font-size="22">🐝
    <animate attributeName="x" values="0;20;40;20;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="28;22;28;34;28" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
