<svg xmlns="http://www.w3.org/2000/svg" width="880" height="2">
    <text x="0" y="18" text-anchor="start"
        fill="url(#gradient)"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji"
        font-size="1.5em"
        font-weight="600">welcome!</text>
    <defs>
        <linearGradient id="gradient" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0">
            <stop offset="0%" stop-color="#B3A369">
                <animate attributeName="stop-color" values="#B3A369;#003057;#B3A369" dur="4s" begin="0s" repeatCount="indefinite"/>
            </stop>
            <stop offset="50%" stop-color="#B3A369">
                <animate attributeName="stop-color" values="#B3A369;#003057;#B3A369" dur="4s" begin="1s" repeatCount="indefinite"/>
            </stop>
            <stop offset="100%" stop-color="#B3A369">
                <animate attributeName="stop-color" values="#B3A369;#003057;#B3A369" dur="4s" begin="2s" repeatCount="indefinite"/>
            </stop>
        </linearGradient>
    </defs>
</svg>
