<svg xmlns="http://www.w3.org/2000/svg" width="132" height="24" viewBox="0 0 132 24">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003057" />
      <stop offset="50%" stop-color="#B3A369" />
      <stop offset="100%" stop-color="#003057" />
    </linearGradient>

    <pattern id="pattern" x="0" y="0" width="300%" height="100%" patternUnits="userSpaceOnUse">
      <rect width="150%" height="100%" fill="url(#gradient)">
        <animate attributeName="x" from="-150%" to="0" dur="3.6s" repeatCount="indefinite" />
      </rect>
      <rect x="150%" width="150%" height="100%" fill="url(#gradient)">
        <animate attributeName="x" from="0" to="150%" dur="3.6s" repeatCount="indefinite" />
      </rect>
    </pattern>
  </defs>

  <text
    x="0"
    y="18"
    fill="url(#pattern)"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji"
    font-size="18"
    font-weight="700"
  >
    welcome!
  </text>
</svg>
